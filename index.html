<style>
:root{--bg:#f2f4f9;--card:#fff;--soft:#eaedf5;--ink:#101627;--mute:#5b6479;--line:#e0e4ee;--acc:#e4540a;--acc-ink:#fff;--ok:#0f8a5f;--warn:#b86e00;--bad:#c8352c;--r:16px;--sh:0 10px 30px -12px rgba(16,22,39,.25);--hf:'Bricolage Grotesque','Barlow Condensed',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c1222;--card:#141c31;--soft:#1b2540;--ink:#eef1f8;--mute:#9aa5bd;--line:#232d48;--acc:#ff8a3d;--acc-ink:#1a0e05;--ok:#43d3a0;--warn:#f2b84b;--bad:#ff6b61;--sh:0 14px 34px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Instrument Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{display:flex;align-items:center;gap:10px;font:800 22px var(--hf);letter-spacing:-.01em;margin-right:auto}
header b:before{content:"";width:12px;height:22px;border-radius:4px;background:var(--acc);transform:skewX(-12deg)}
nav{display:flex;gap:4px}
nav a,.link{color:var(--mute);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;background:none;border:0;font-family:inherit;font-size:inherit;transition:background .15s,color .15s}
nav a:hover,.link:hover{background:var(--soft);color:var(--ink)}
nav a.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
nav a .ic{display:none}
#who{font-weight:600;font-size:14px}
main{max-width:720px;margin:0 auto;padding:28px 16px 90px}
#app.wide{max-width:980px}
h1{font:800 clamp(34px,7vw,52px)/1.02 var(--hf);letter-spacing:-.03em;margin:6px 0 8px}
h2{font:700 22px var(--hf);letter-spacing:-.02em;margin:30px 0 10px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.card.item:hover{border-color:var(--acc)}
button,.btn{font:600 16px 'Instrument Sans',sans-serif;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:filter .15s,background .15s,transform .1s}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.07)}
button:active:not(:disabled),.btn:active{transform:scale(.98)}
button.alt,.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.alt:hover:not(:disabled),.btn.alt:hover{background:var(--soft);filter:none}
button.del{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);padding:8px 14px}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%;transition:border-color .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.8}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);background:var(--card)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 90px}.row.nowrap{flex-wrap:nowrap}
.tag{font-size:14px;font-weight:600;color:var(--ok)}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s cubic-bezier(.3,.8,.3,1)}
.ex{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:4px}.ex:last-child{padding-bottom:4px}
.ex input[type=checkbox]{-webkit-appearance:none;appearance:none;display:grid;place-content:center;width:30px;height:30px;padding:0;flex:none;margin-top:1px;border-radius:10px;border:2px solid var(--line);background:var(--soft);cursor:pointer;transition:background .15s,border-color .15s}
.ex input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.ex input[type=checkbox]:after{content:"";width:7px;height:13px;border:solid var(--acc-ink);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
.ex input[type=checkbox]:checked:after{transform:rotate(45deg) scale(1)}
.ex.done .nm{text-decoration:line-through;color:var(--mute)}
.nm{font:700 19px/1.25 var(--hf);letter-spacing:-.01em}
.ex .w{margin-top:8px;padding:8px 12px;font-size:15px}
.last{font-size:14px;color:var(--ok);font-weight:600}.last:empty{display:none}
.vid{display:inline-block;margin-top:8px;padding:7px 13px;border-radius:99px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:600;font-size:14px;text-decoration:none}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 calc(12px + env(safe-area-inset-bottom));margin:0}
.bd{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px;margin-left:6px;line-height:1.5}
.bub{max-width:84%;padding:10px 15px;border-radius:20px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{margin-left:auto;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.bub.ot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.day{text-align:center;color:var(--mute);font-size:13px;margin:16px 0 4px}
.comp{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:12px 0;margin-top:12px}
.comp textarea{flex:1;resize:none;max-height:140px}
.x{background:none;border:0;color:inherit;opacity:.85;text-decoration:underline;padding:0;font:inherit;font-size:12px;border-radius:0;cursor:pointer}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:8px 0 16px;gap:2px}
.seg a{flex:1;text-align:center;padding:9px 6px;border-radius:10px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;transition:background .15s}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chead{display:flex;align-items:center;gap:8px;margin:8px 0}
.chead h2{margin:0;flex:1;text-transform:capitalize}
.chead button{min-height:44px;min-width:44px;padding:8px 12px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cw{font-size:12px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0}
.cd{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:60px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;cursor:pointer}
.cd:hover{border-color:var(--acc);filter:none}
.cd.other{opacity:.35}
.cd.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cd.today .n{background:var(--acc);color:var(--acc-ink)}
.n{font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.dots{display:flex;gap:3px;justify-content:center;min-height:8px}
.d{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.d.done{background:var(--ok)}.d.part{background:var(--warn)}.d.miss{background:var(--mute);opacity:.6}
.ct{display:none}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:14px 0}.leg .d{margin-right:5px;vertical-align:middle}
.st-done{color:var(--ok)}.st-part{color:var(--warn)}.st-miss{color:var(--mute)}.st-plan{color:var(--acc)}
@media(min-width:700px){
 .cd{min-height:108px;align-items:stretch;padding:7px}
 .n{align-self:flex-start}.dots{display:none}
 .ct{display:block;font-size:12px;font-weight:600;text-align:left;padding:3px 7px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ct.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.ct.part{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}.ct.miss{background:var(--soft);color:var(--mute)}
}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(3px);display:grid;place-items:end center;z-index:50}
.sheet{background:var(--card);width:min(520px,100%);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:var(--sh)}
@media(min-width:601px){.modal{place-items:center}.sheet{border-radius:24px}}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:99px;padding:6px 8px 6px 14px;margin:8px 8px 0 0}.chip .x{padding:6px;text-decoration:none}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:14px;margin:0 0 14px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}.pw button{flex:none;min-height:44px}
.usr{display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);display:grid;place-items:center;font:800 22px var(--hf);flex:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font:800 40px/1 var(--hf);letter-spacing:-.03em}.stat span{color:var(--mute);font-size:14px}
.wk{display:flex;gap:8px;height:130px;margin:10px 0 4px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.wk em{font-style:normal;font-size:12px;color:var(--mute)}
.wk i{display:block;width:100%;background:var(--soft);border-radius:8px;min-height:4px}.wk i.now{background:var(--acc)}
.wkl{display:flex;gap:8px}.wkl span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.lc{width:100%;height:auto;display:block}
.lc-line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lc-dot{fill:var(--acc)}.lc-pr{fill:var(--ok)}.lc-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.lc-txt{fill:var(--mute);font-size:10px}
.inst{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
body.out header{display:none}
.hero{max-width:520px;margin:0 auto;padding-top:max(4vh,16px)}
.hero .bell{width:92px;color:var(--acc);margin-bottom:14px}
.kicker{font-weight:600;font-size:15px;color:var(--acc)}
.hero h1{font-size:clamp(44px,13vw,72px);margin:8px 0 14px}
.lead{font-size:18px;color:var(--mute);margin:0 0 26px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:14px;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.15)}.gbtn:disabled{opacity:.7}
.fine{font-size:13px;color:var(--mute);margin:10px 0 22px;text-align:center}
.hero #emailbox{margin:0 0 30px}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.feat li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.feat b{display:block;font:700 19px var(--hf);letter-spacing:-.01em}.feat span{color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.hero>*:nth-child(2){animation-delay:.05s}.hero>*:nth-child(3){animation-delay:.1s}.hero>*:nth-child(4){animation-delay:.15s}.hero>*:nth-child(n+5){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){
 body{font-size:17px}
 header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;gap:8px}
 header b{font-size:20px}
 #who{font-size:14px;margin-left:auto}
 header #out{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
 nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);justify-content:space-around;gap:0;padding:6px}
 nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 2px;border-radius:18px;position:relative}
 nav a .ic{display:block;width:24px;height:24px}
 nav a .bd{position:absolute;top:2px;left:54%;margin:0}
 main{padding:20px 14px calc(120px + env(safe-area-inset-bottom))}
 .card{padding:16px 14px}
 button,.btn{min-height:50px;border-radius:14px;padding:12px 16px;font-size:17px}
 button.del{padding:12px 16px}
 .link{padding:12px 10px}
 .ex input[type=checkbox]{width:32px;height:32px}
 .row>*{flex:1 1 45%}
 #save{width:100%}
 .comp,.stick{bottom:calc(84px + env(safe-area-inset-bottom))}
 .stick{padding:14px 0}
}
.rt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 12px 10px 18px;box-shadow:var(--sh);width:min(440px,calc(100% - 24px))}
.rt div{flex:1;display:flex;flex-direction:column;line-height:1.2}.rt b{font:800 28px var(--hf)}.rt span{font-size:13px;opacity:.75}
.rt button{min-height:40px;padding:6px 12px;font-size:14px}.rt button.alt{color:inherit;border-color:rgba(128,128,128,.5)}
.rt.go{background:var(--acc);color:var(--acc-ink)}
@media(max-width:600px){.rt{bottom:calc(86px + env(safe-area-inset-bottom))}}
details.act summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center}
details.act summary::-webkit-details-marker{display:none}
details.act[open] summary{margin-bottom:8px}
.act .it{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chips button{min-height:36px;padding:6px 12px;border-radius:99px;font-size:14px}
#who,#out{display:none!important}
#me{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font:800 18px var(--hf);display:grid;place-items:center;text-decoration:none;margin-left:auto}
#me[hidden]{display:none}
.sp{display:flex;gap:16px;align-items:center}
.sp img{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft)}
.spi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.spi b{font:700 20px var(--hf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{display:flex;gap:8px;margin-top:6px}.ctl button{flex:1;min-height:46px;font-size:20px;padding:6px}
.vol{font-size:13px;font-weight:500;color:var(--mute);margin:8px 0 0}
.spi input[type=range]{padding:0;height:28px;background:none;border:0;accent-color:var(--acc)}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pl{padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:left;overflow:hidden;border-radius:14px}
.pl img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft)}
.pl span{display:block;padding:8px 10px;font-weight:600;font-size:14px;line-height:1.3}
.tr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tr img{width:44px;height:44px;border-radius:8px;flex:none;background:var(--soft)}
.tr div{flex:1;min-width:0}.tr button{min-height:42px;padding:6px 14px}
@media(max-width:600px){#me{margin-left:auto}.sp img{width:80px;height:80px}}
.exl{display:grid;gap:12px;margin:14px 0}
.xc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;transition:border-color .2s,opacity .2s}
.xc.now{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
.xc.done{opacity:.78}
.xh{display:flex;align-items:center;gap:12px}
.xh input[type=checkbox]{-webkit-appearance:none;appearance:none;display:grid;place-content:center;width:34px;height:34px;padding:0;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--soft);cursor:pointer;transition:background .15s,border-color .15s}
.xh input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.xh input[type=checkbox]:after{content:"";width:8px;height:15px;border:solid var(--acc-ink);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
.xh input[type=checkbox]:checked:after{transform:rotate(45deg) scale(1)}
.xh .nm{flex:1;margin:0;font-size:20px;cursor:pointer}
.xc.done .nm{text-decoration:line-through;color:var(--mute)}
.xn{font-size:13px;color:var(--mute);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;background:var(--soft);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;border:0;color:var(--ink);min-height:0}

.xnote{margin:10px 0 0;color:var(--mute);font-size:15px}
.xc .last{margin-top:10px}
.wr{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.wr .w{flex:1;text-align:center;font-weight:600;font-size:17px}
.wr button{flex:none;width:52px;min-height:46px;padding:0;font-size:22px}
.fin{border-color:var(--ok);color:var(--ok);font-weight:600;text-align:center}
.xc.done .pills,.xc.done .xnote,.xc.done .vid{display:none}
</style>
</head>
<body>
<header><b>SÉANCES</b><nav id="nav"></nav><span id="who" class="mute"></span><a id="me" href="#/plus" hidden aria-label="Mon compte"></a><button class="alt" id="out" hidden>Quitter</button></header>

let rt = null, wl = null;
const parseRest = t => { t = String(t || '').toLowerCase(); let m = /(\d+)\s*(?:min|m|')\s*(\d+)?/.exec(t); if (m) return +m[1] * 60 + (+m[2] || 0); m = /(\d+):(\d{2})/.exec(t); if (m) return +m[1] * 60 + +m[2]; m = /(\d+)/.exec(t); return m ? +m[1] : 0; };
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(c.currentTime + .35); } catch (e) {} }
function stopRest() { if (rt) { clearInterval(rt.i); rt = null; } const el = $('#rt'); if (el) el.remove(); }
function startRest(sec, label) {
  stopRest();
  const el = document.createElement('div'); el.id = 'rt'; el.className = 'rt'; el.setAttribute('role', 'timer');
  el.innerHTML = '<div><b id="rtt">0:00</b><span id="rtl"></span></div><button class="alt" id="rtm">−15 s</button><button class="alt" id="rtp">+15 s</button><button id="rtx" aria-label="Arrêter le repos">✕</button>';
  document.body.appendChild(el);
  $('#rtl').textContent = 'Repos · ' + label;
  rt = {end: Date.now() + sec * 1000, el};
  const tick = () => {
    if (!rt || rt.el !== el) return;
    const left = Math.ceil((rt.end - Date.now()) / 1000);
    if (left <= 0) {
      $('#rtt').textContent = 'Go !'; $('#rtl').textContent = 'Repos terminé'; el.classList.add('go');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]); beep(); clearInterval(rt.i);
      setTimeout(() => { if (rt && rt.el === el) stopRest(); }, 6000); return;
    }
    $('#rtt').textContent = Math.floor(left / 60) + ':' + pad(left % 60);
  };
  rt.i = setInterval(tick, 250); tick();
  $('#rtm').onclick = () => { if (rt) { rt.end -= 15000; tick(); } };
  $('#rtp').onclick = () => { if (rt) { rt.end += 15000; tick(); } };
  $('#rtx').onclick = stopRest;
}

const SP = {id: SPOTIFY_CLIENT_ID, scope: 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private', redir: () => location.origin + location.pathname};
const spGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const spSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rnd = n => b64(crypto.getRandomValues(new Uint8Array(n)));

  const v = rnd(48), st = rnd(12);

  const ch = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({client_id: SP.id, response_type: 'code', redirect_uri: SP.redir(), scope: SP.scope, code_challenge_method: 'S256', code_challenge: ch, state: st});

  const j = await r.json(); if (!r.ok) throw new Error(j.error_description || 'Erreur Spotify');
  const t = {a: j.access_token, r: j.refresh_token || (spGet('sp_t') || {}).r, e: Date.now() + j.expires_in * 1000 - 60000};
  spSet('sp_t', t); return t;
}

  return t.a;
}

  if (r.status === 204 || r.status === 202) return null;

const when = t => new Date(t).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
const dayKey = t => new Date(t - new Date(t).getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const dayLabel = t => { const k = dayKey(t), n = Date.now(); return k === dayKey(n) ? "Aujourd'hui" : k === dayKey(n - 864e5) ? 'Hier' : fmt(k); };
const whenShort = t => dayKey(t) === dayKey(Date.now()) ? when(t) : new Date(t).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
const linkify = t => esc(t).replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer nofollow" style="color:inherit;text-decoration:underline">$1</a>');

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ST = {done: 'Terminée', part: 'En cours', miss: 'Manquée', plan: 'Prévue'};

function copyModal(src) {

  q('#cok').onclick = async () => {
    const v = q('#cd').value, list = dates.length ? dates : (v ? [v] : []);

let cal = null;
async function calendarPage() {
  app.classList.add('wide');
  const t0 = new Date();
  if (!cal) cal = {y: t0.getFullYear(), m: t0.getMonth(), sel: today()};
  const sessions = await all(), byDay = {}, cache = {};
  sessions.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  const status = s => { const n = cache[s.id] || 0, tot = s.exercises.length; return tot && n >= tot ? 'done' : n ? 'part' : s.date < today() ? 'miss' : 'plan'; };
  const loadLogs = async () => {
    const pre = `${cal.y}-${pad(cal.m + 1)}`;
    await Promise.all(sessions.filter(s => s.date.startsWith(pre) && !(s.id in cache)).map(async s => {
      try { const d = await db.collection('logs').doc(s.id + '_' + user.uid).get(); cache[s.id] = d.exists ? Object.values(d.data().done || {}).filter(Boolean).length : 0; }
      catch (e) { cache[s.id] = 0; }
    }));
  };
  const go = async dm => {
    cal.m += dm; if (cal.m < 0) { cal.m = 11; cal.y--; } if (cal.m > 11) { cal.m = 0; cal.y++; }
    const pre = `${cal.y}-${pad(cal.m + 1)}`; cal.sel = today().startsWith(pre) ? today() : pre + '-01';
    await loadLogs(); draw();
  };
  const draw = () => {
    if (!$('#app') || !app.classList.contains('wide')) return;
    const first = new Date(cal.y, cal.m, 1), off = (first.getDay() + 6) % 7, dim = new Date(cal.y, cal.m + 1, 0).getDate();
    const cells = Math.ceil((off + dim) / 7) * 7, pre = `${cal.y}-${pad(cal.m + 1)}`;
    const ms = sessions.filter(s => s.date.startsWith(pre)), done = ms.filter(s => status(s) === 'done').length;
    let grid = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(w => `<div class="cw">${w}</div>`).join('');
    for (let i = 0; i < cells; i++) {
      const d = new Date(cal.y, cal.m, 1 - off + i), k = iso(d), list = byDay[k] || [];
      grid += `<button class="cd ${d.getMonth() !== cal.m ? 'other' : ''} ${k === today() ? 'today' : ''} ${k === cal.sel ? 'sel' : ''}" data-d="${k}" aria-label="${esc(fmt(k))}${list.length ? ', ' + list.length + ' séance' + (list.length > 1 ? 's' : '') : ''}"><span class="n">${d.getDate()}</span>
        <span class="dots">${list.slice(0, 3).map(s => `<i class="d ${status(s)}"></i>`).join('')}</span>
        ${list.slice(0, 2).map(s => `<span class="ct ${status(s)}">${esc(s.title)}</span>`).join('')}${list.length > 2 ? `<span class="ct">+${list.length - 2}</span>` : ''}</button>`;
    }
    const sel = byDay[cal.sel] || [], label = dayLabel(new Date(cal.sel + 'T12:00').getTime());
    app.innerHTML = `<h1>Calendrier</h1>${seg('cal')}
      <div class="chead"><h2>${first.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'})}</h2><button class="alt" id="cprev" aria-label="Mois précédent">‹</button><button class="alt" id="ctoday">Aujourd’hui</button><button class="alt" id="cnext" aria-label="Mois suivant">›</button></div>
      <p class="mute" style="margin:0 0 8px">${ms.length} séance${ms.length > 1 ? 's' : ''} ce mois · ${done} terminée${done > 1 ? 's' : ''}</p>
      <div class="cgrid" id="cg">${grid}</div>

    app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {

    if ($('#cph')) $('#cph').onclick = async () => {

const short = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
const parseLoad = w => { const m = /(\d+(?:[.,]\d+)?)\s*kg/i.exec(w) || /(\d+(?:[.,]\d+)?)/.exec(w); return m ? parseFloat(m[1].replace(',', '.')) : null; };
const fmtNum = n => String(Math.round(n * 100) / 100).replace('.', ',');
let histCache = {};

async function logsOf(uid) {
  try {
    return (await db.collection('logs').where('uid', '==', uid).get()).docs.map(d => d.data());
  } catch (e) {
    // anciennes règles Firestore : lecture séance par séance
    const out = [];
    await Promise.all((await all()).map(async s => {
      try { const d = await db.collection('logs').doc(s.id + '_' + uid).get(); if (d.exists) out.push(d.data()); } catch (x) {}
    }));
    return out;
  }
}

async function getHistory(uid, fresh) {
  const c = histCache[uid];
  if (!fresh && c && Date.now() - c.t < 300000) return c.v;
  const [ss, logs] = await Promise.all([all(), logsOf(uid)]);
  const byId = {}; ss.forEach(s => { byId[s.id] = s; });
  const entries = [], done = [];
  logs.forEach(l => {
    const s = byId[l.sessionId]; if (!s) return;
    const n = s.exercises.filter((_, i) => l.done && l.done[i]).length;
    if (n) done.push({date: s.date, id: s.id, title: s.title, n, total: s.exercises.length});
    s.exercises.forEach((e, i) => {
      const w = String((l.w || {})[i] || '').trim();
      if (w) entries.push({date: s.date, id: s.id, title: s.title, name: e.name, key: e.name.trim().toLowerCase(), w, num: parseLoad(w)});
    });
  });
  const by = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  entries.sort(by); done.sort(by);
  const v = {entries, done};
  histCache[uid] = {t: Date.now(), v};
  return v;
}

function computeStats(done) {
  const dn = k => Math.round(new Date(k + 'T12:00').getTime() / 864e5), t = today();
  const days = [...new Set(done.map(d => d.date))].sort().map(dn), set = new Set(days);
  let cur = 0, c = dn(t); if (!set.has(c)) c--;
  while (set.has(c)) { cur++; c--; }
  let best = 0, run = 0, prev = null;
  days.forEach(n => { run = prev !== null && n === prev + 1 ? run + 1 : 1; prev = n; best = Math.max(best, run); });
  const monday = k => { const d = new Date(k + 'T12:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
  const wc = {}; done.forEach(d => { const k = monday(d.date); wc[k] = (wc[k] || 0) + 1; });
  const m0 = monday(t), bars = [];
  for (let i = 7; i >= 0; i--) { const d = new Date(m0 + 'T12:00'); d.setDate(d.getDate() - 7 * i); const k = iso(d); bars.push({k, n: wc[k] || 0}); }
  let ws = 0; const d = new Date(m0 + 'T12:00'); if (!wc[iso(d)]) d.setDate(d.getDate() - 7);
  while (wc[iso(d)]) { ws++; d.setDate(d.getDate() - 7); }
  return {cur, best, ws, bars, week: wc[m0] || 0, month: done.filter(x => x.date.startsWith(t.slice(0, 7))).length, total: done.length};
}

function lineChart(pts) {
  const W = 320, H = 160, p = {l: 38, r: 12, t: 16, b: 24};
  const vals = pts.map(x => x.num), mn = Math.min(...vals), mx = Math.max(...vals);
  const lo = mn === mx ? mn - 1 : mn - (mx - mn) * .15, hi = mn === mx ? mx + 1 : mx + (mx - mn) * .15;
  const X = i => p.l + (pts.length === 1 ? (W - p.l - p.r) / 2 : i * (W - p.l - p.r) / (pts.length - 1));
  const Y = v => p.t + (hi - v) / (hi - lo) * (H - p.t - p.b);
  const prI = vals.indexOf(mx);
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression">
    <line class="lc-grid" x1="${p.l}" x2="${W - p.r}" y1="${Y(mx)}" y2="${Y(mx)}"/><line class="lc-grid" x1="${p.l}" x2="${W - p.r}" y1="${Y(mn)}" y2="${Y(mn)}"/>
    <text class="lc-txt" x="${p.l - 6}" y="${Y(mx) + 3}" text-anchor="end">${fmtNum(mx)}</text>${mx !== mn ? `<text class="lc-txt" x="${p.l - 6}" y="${Y(mn) + 3}" text-anchor="end">${fmtNum(mn)}</text>` : ''}
    ${pts.length > 1 ? `<polyline class="lc-line" points="${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x.num).toFixed(1)).join(' ')}"/>` : ''}
    ${pts.map((x, i) => `<circle class="${i === prI ? 'lc-pr' : 'lc-dot'}" cx="${X(i).toFixed(1)}" cy="${Y(x.num).toFixed(1)}" r="${i === prI ? 5 : 3.5}"/>`).join('')}
    <text class="lc-txt" x="${p.l}" y="${H - 6}">${short(pts[0].date)}</text>${pts.length > 1 ? `<text class="lc-txt" x="${W - p.r}" y="${H - 6}" text-anchor="end">${short(pts[pts.length - 1].date)}</text>` : ''}
  </svg>`;
}

async function progressPage() {
  let uid = user.uid, users = [];
  if (isAdmin) users = (await db.collection('users').get().catch(() => ({docs: []}))).docs.map(d => ({uid: d.id, ...d.data()})).filter(u => u.uid !== user.uid);
  let exKey = null;
  const draw = async () => {
    const h = await getHistory(uid, true), st = computeStats(h.done), mxb = Math.max(3, ...st.bars.map(b => b.n));
    const groups = {};
    h.entries.filter(x => x.num != null).forEach(x => { const g = groups[x.key] || (groups[x.key] = {key: x.key, name: x.name, list: []}); g.list.push(x); g.name = x.name; });
    const names = Object.values(groups).sort((a, b) => b.list.length - a.list.length);
    if (!names.find(g => g.key === exKey)) exKey = names.length ? names[0].key : null;
    const g = exKey ? groups[exKey] : null;
    let exHtml = '<p class="mute">Note tes charges dans les séances : la courbe apparaîtra ici.</p>';
    if (g) {
      const l = g.list, last = l[l.length - 1], best = l.reduce((a, b) => b.num >= a.num ? b : a), first = l[0], diff = last.num - first.num;
      exHtml = `<label for="exs">Exercice</label><select id="exs">${names.map(n => `<option value="${esc(n.key)}" ${n.key === exKey ? 'selected' : ''}>${esc(n.name)} (${n.list.length})</option>`).join('')}</select>
        <div class="card">${lineChart(l)}</div>
        <div class="stats"><div class="stat"><b>${fmtNum(last.num)}</b><span>Dernière charge (kg)</span></div><div class="stat"><b>${fmtNum(best.num)}</b><span>Record · ${short(best.date)}</span></div>
        <div class="stat"><b>${l.length > 1 ? (diff > 0 ? '+' : '') + fmtNum(diff) : '–'}</b><span>Depuis le début (kg)</span></div></div>
        <div class="card">${l.slice(-8).reverse().map(x => `<a class="item" style="padding:8px 0;border-top:1px solid var(--line)" href="#/seance/${x.id}"><span><b>${esc(x.w)}</b><br><span class="mute">${esc(x.title)}</span></span><span class="mute">${short(x.date)}</span></a>`).join('').replace('border-top:1px solid var(--line)', 'border-top:0')}</div>`;
    }
    $('#pbody').innerHTML = `<div class="stats">
      <div class="stat"><b>${st.week}</b><span>Séances cette semaine</span></div><div class="stat"><b>${st.month}</b><span>Séances ce mois</span></div><div class="stat"><b>${st.total}</b><span>Séances au total</span></div>
      <div class="stat"><b>${st.cur}</b><span>Jour${st.cur > 1 ? 's' : ''} d’affilée</span></div><div class="stat"><b>${st.best}</b><span>Meilleure série (jours)</span></div><div class="stat"><b>${st.ws}</b><span>Semaine${st.ws > 1 ? 's' : ''} d’affilée</span></div></div>
      <h2>Séances par semaine</h2><div class="wk">${st.bars.map((b, i) => `<div><em>${b.n}</em><i class="${i === st.bars.length - 1 ? 'now' : ''}" style="height:${b.n / mxb * 78}%"></i></div>`).join('')}</div>
      <div class="wkl">${st.bars.map(b => `<span>${short(b.k)}</span>`).join('')}</div>
      <h2>Progression d’un exercice</h2>${exHtml}`;
    if ($('#exs')) $('#exs').onchange = e => { exKey = e.target.value; draw(); };
  };
  app.innerHTML = `<h1>Progrès</h1>${isAdmin && users.length ? `<label for="pu">Voir les progrès de</label><select id="pu"><option value="${user.uid}">Moi</option>${users.map(u => `<option value="${esc(u.uid)}">${esc(u.name)}</option>`).join('')}</select>` : ''}<div id="pbody"><p class="mute">Chargement…</p></div>`;
  if ($('#pu')) $('#pu').onchange = e => { uid = e.target.value; exKey = null; draw(); };
  try { await draw(); } catch (e) { $('#pbody').innerHTML = `<div class="card">Erreur : ${esc(e.message)}</div>`; }
}

async function usersPage() {
  let list = [], stats = {}, tab = 'all';
  const STALE = 60 * 864e5, now = Date.now();
  const kind = u => u.blocked ? 'blocked' : (!u.seen || now - u.seen > STALE) ? 'stale' : 'active';
  const load = async () => {
    const [us, lg] = await Promise.all([db.collection('users').get(), db.collection('logs').get()]);
    stats = {};
    lg.docs.forEach(d => { const l = d.data(), c = stats[l.uid] || (stats[l.uid] = {seances: 0, ex: 0}), n = Object.values(l.done || {}).filter(Boolean).length; if (n) { c.seances++; c.ex += n; } });
    list = us.docs.map(d => ({uid: d.id, ...d.data()})).sort((a, b) => (b.seen || 0) - (a.seen || 0));
  };
  const isAdm = u => (u.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  const purge = async us => {
    const refs = [];
    for (const u of us) {
      refs.push(db.collection('users').doc(u.uid));
      (await db.collection('logs').where('uid', '==', u.uid).get()).docs.forEach(d => refs.push(d.ref));
      (await db.collection('messages').where('uid', '==', u.uid).get()).docs.forEach(d => refs.push(d.ref));
    }
    for (let i = 0; i < refs.length; i += 450) { const b = db.batch(); refs.slice(i, i + 450).forEach(r => b.delete(r)); await b.commit(); }
  };
  const run = async f => { try { await f(); await load(); draw(); } catch (e) { alert(e.message); } };
  await load();
  app.innerHTML = `<h1>Inscrits</h1><div class="seg" id="ut"></div><p class="mute" id="uh"></p>
    <input id="q" type="search" placeholder="Rechercher un nom ou un e-mail" aria-label="Rechercher"><div id="ul" style="margin-top:8px"></div>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), cnt = k => list.filter(u => k === 'all' || kind(u) === k).length;
    $('#ut').innerHTML = [['all', 'Tous'], ['active', 'Actifs'], ['stale', 'Inactifs'], ['blocked', 'Bloqués']].map(([k, t]) => `<a href="#" data-t="${k}" class="${tab === k ? 'on' : ''}">${t} (${cnt(k)})</a>`).join('');
    $('#ut').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.t; draw(); });
    const f = list.filter(u => (tab === 'all' || kind(u) === tab) && ((u.name || '') + ' ' + (u.email || '')).toLowerCase().includes(q));
    const bulk = tab === 'stale' ? f.filter(u => !isAdm(u) && u.uid !== user.uid) : [];
    $('#uh').innerHTML = tab === 'stale' ? `Pas connectés depuis plus de 60 jours.${bulk.length ? ' <button class="del" id="ubulk">Supprimer ces ' + bulk.length + ' comptes</button>' : ''}` : 'Si tu supprimes quelqu’un de Firebase Authentication, supprime-le aussi ici. Pour couper un accès tout de suite, utilise « Bloquer ».';
    $('#ul').innerHTML = f.length ? f.map(u => {
      const st = stats[u.uid] || {seances: 0, ex: 0}, me = u.uid === user.uid;
      return `<div class="card"><div class="usr"><div class="av">${esc((u.name || '?').trim()[0] || '?').toUpperCase()}</div>
        <div style="flex:1;min-width:0"><b>${esc(u.name)}</b>${isAdm(u) ? ' <span class="tag">Admin</span>' : ''}${me ? ' <span class="mute">(toi)</span>' : ''}${u.blocked ? ' <span class="err">Bloqué</span>' : ''}<br>
        <span class="mute" style="overflow-wrap:anywhere">${esc(u.email)}</span><br>
        <span class="mute">Vu ${u.seen ? dayLabel(u.seen).toLowerCase() + ' à ' + when(u.seen) : 'jamais'} · ${st.seances} séance${st.seances > 1 ? 's' : ''} · ${st.ex} exercice${st.ex > 1 ? 's' : ''}</span></div></div>
        ${me || isAdm(u) ? '' : `<p class="row" style="margin:10px 0 0"><a class="btn alt" href="#/messages/${esc(u.uid)}">Message</a><button class="alt" data-bl="${esc(u.uid)}">${u.blocked ? 'Débloquer' : 'Bloquer'}</button><button class="del" data-rm="${esc(u.uid)}">Supprimer</button></p>`}</div>`;
    }).join('') : '<p class="mute">Aucun résultat.</p>';
    const by = id => list.find(u => u.uid === id);
    $('#ul').querySelectorAll('[data-bl]').forEach(b => b.onclick = () => { const u = by(b.dataset.bl); if (!u.blocked && !confirm('Bloquer ' + u.name + ' ? Son accès est coupé immédiatement.')) return; run(() => db.collection('users').doc(u.uid).update(u.blocked ? {blocked: firebase.firestore.FieldValue.delete()} : {blocked: true, blockedAt: Date.now()})); });
    $('#ul').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const u = by(b.dataset.rm); if (confirm('Supprimer ' + u.name + ' et toutes ses données (suivi, messages) ?\nSi son compte existe encore dans Firebase Authentication, il réapparaîtra à sa prochaine connexion : préfère « Bloquer ».')) run(() => purge([u])); });
    if ($('#ubulk')) $('#ubulk').onclick = () => { if (confirm('Supprimer définitivement ' + bulk.length + ' comptes inactifs et leurs données ?')) run(() => purge(bulk)); };

      <div class="stats"><div class="stat"><b>${act}/${rows.length}</b><span>Personnes actives</span></div><div class="stat"><b>${totS}</b><span>Séances suivies</span></div><div class="stat"><b>${totE}</b><span>Exercices cochés</span></div></div>
      <p class="mute">${planned} séance${planned > 1 ? 's' : ''} prévue${planned > 1 ? 's' : ''} sur la période. Touche une personne pour voir le détail.</p>
      ${rows.length ? rows.map(r => { const pct = planned ? Math.min(100, Math.round(r.items.length / planned * 100)) : 0; return `<details class="card act" ${r.p.uid === focus ? 'open' : ''}><summary><div class="av">${esc((r.p.name || '?').trim()[0] || '?').toUpperCase()}</div><div style="flex:1;min-width:0"><b>${esc(r.p.name)}</b>${r.p.blocked ? ' <span class="err">Bloqué</span>' : ''}<br><span class="mute">${r.items.length}/${planned} séances · ${r.ex} exercices · ${r.last ? esc(dayLabel(r.last)) : 'aucune activité'}</span><div class="bar"><i style="width:${pct}%"></i></div></div></summary>
        ${r.items.length ? r.items.map(x => `<div class="it"><a href="#/seance/${esc(x.s.id)}" style="color:inherit"><b>${esc(x.s.title)}</b></a> <span class="mute">${esc(fmt(x.s.date))} · ${x.n}/${x.s.exercises.length}</span><br>${x.s.exercises.map((e, i) => x.l.done && x.l.done[i] ? '✓ ' + esc(e.name) + (x.l.w && x.l.w[i] ? ' — ' + esc(x.l.w[i]) : '') : '').filter(Boolean).join('<br>')}${x.l.note ? `<br><i>« ${esc(x.l.note)} »</i>` : ''}</div>`).join('') : '<p class="mute" style="margin:12px 0 0">Rien de coché sur cette période.</p>'}
        <p style="margin:12px 0 0"><a class="btn alt" href="#/messages/${esc(r.p.uid)}">Message</a></p></details>`; }).join('') : '<p class="mute">Aucun inscrit.</p>'}`;
    app.querySelectorAll('[data-p]').forEach(a => a.onclick = e => { e.preventDefault(); days = +a.dataset.p; draw(); });
  };
  draw();
}

async function messagesPage(uid) {
  if (!isAdmin) return thread(user.uid, nm(user));
  if (uid) return thread(uid);
  app.innerHTML = `<h1>Messages</h1><p class="row"><button id="newm" class="alt">+ Nouveau message</button><button id="bcast" class="alt">Message à tous</button></p><div id="usrs" hidden></div><input id="mq" type="search" placeholder="Rechercher une conversation" aria-label="Rechercher"><div id="inbox" style="margin-top:8px"></div>`;
  notifAsk($('#mq'));
  const us = (await db.collection('users').get().catch(() => ({docs: []}))).docs.map(d => ({uid: d.id, ...d.data()})).filter(u => u.uid !== user.uid);
  $('#usrs').innerHTML = us.length ? us.map(u => `<a class="card item" href="#/messages/${esc(u.uid)}"><b>${esc(u.name)}</b><span class="mute">${esc(u.email)}</span></a>`).join('') : '<p class="mute">Personne ne s’est encore connecté.</p>';
  $('#newm').onclick = () => { $('#usrs').hidden = !$('#usrs').hidden; };
  $('#bcast').onclick = () => broadcastModal(us.filter(u => !u.blocked));
  let ms = [];
  const draw = () => {
    if (!$('#inbox')) return;
    const q = $('#mq').value.trim().toLowerCase(), g = {};
    ms.forEach(m => {
      const c = g[m.uid] || (g[m.uid] = {uid: m.uid, name: m.name, last: m, unread: 0});
      if (m.createdAt >= c.last.createdAt) c.last = m;
      if (m.from === 'user') { c.name = m.name; if (!m.readByAdmin) c.unread++; }
    });
    const list = Object.values(g).filter(c => !q || (c.name + ' ' + c.last.text).toLowerCase().includes(q)).sort((a, b) => (b.unread > 0) - (a.unread > 0) || b.last.createdAt - a.last.createdAt);
    $('#inbox').innerHTML = list.length ? list.map(c => `<a class="card item" ${c.unread ? 'style="border-color:var(--acc)"' : ''} href="#/messages/${esc(c.uid)}"><span><b>${esc(c.name)}</b>${c.unread ? `<span class="bd" style="position:static">${c.unread}</span>` : ''}<br><span class="mute">${esc((c.last.from === 'admin' ? 'Toi : ' : '') + c.last.text.slice(0, 80))}</span></span><span class="mute">${whenShort(c.last.createdAt)}</span></a>`).join('') : '<p class="mute">Aucune conversation.</p>';
  };
  $('#mq').oninput = draw;
  pageUnsub = db.collection('messages').onSnapshot(sn => { ms = sn.docs.map(d => d.data()); draw(); }, e => { if ($('#inbox')) $('#inbox').textContent = 'Erreur : ' + e.message; });
}

async function thread(uid, nameHint) {
  const mine = isAdmin ? 'admin' : 'user', other = isAdmin ? 'user' : 'admin', flag = isAdmin ? 'readByAdmin' : 'readByUser';
  let name = nameHint;
  if (isAdmin && !name) { const d = await db.collection('users').doc(uid).get().catch(() => null); name = d && d.exists ? d.data().name : null; }
  app.innerHTML = `${isAdmin ? `<p style="display:flex;gap:4px;flex-wrap:wrap"><a class="link" href="#/messages">← Tous les messages</a><a class="link" href="#/activite/${esc(uid)}">Voir l’activité</a></p>` : ''}<h1 id="tt">${isAdmin ? esc(name || 'Conversation') : 'Messages'}</h1>
  ${isAdmin ? '<p><button class="link" id="delc" hidden>Supprimer la conversation</button></p>' : '<p class="mute">Écris à Alban, sa réponse apparaîtra ici en direct.</p>'}
  <div id="thr"></div>
  <div class="chips" id="qk"></div>
  <div class="comp"><select id="att" aria-label="Joindre une séance" style="flex:none;width:68px;padding:12px 8px"><option value="">📎</option></select><textarea id="msg" rows="1" maxlength="1000" placeholder="Écrire un message…" aria-label="Message"></textarea><button id="send">Envoyer</button></div>`;
  let ms = [], first = true;
  const draw = () => {
    const box = $('#thr'); if (!box) return;
    const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 160;
    let last = '';
    box.innerHTML = ms.length ? ms.map(m => {
      const k = dayKey(m.createdAt), sep = k !== last ? `<div class="day">${dayLabel(m.createdAt)}</div>` : ''; last = k;
      const me = m.from === mine, seen = me && (isAdmin ? m.readByUser : m.readByAdmin);
      return `${sep}<div class="bub ${me ? 'me' : 'ot'}">${linkify(m.text)}<small>${when(m.createdAt)}${seen ? ' · Vu' : ''}${me || isAdmin ? ` · <button class="x" data-del="${m.id}">Supprimer</button>` : ''}</small></div>`;
    }).join('') : '<p class="mute">Aucun message pour l’instant.</p>';
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Supprimer ce message ?')) db.collection('messages').doc(b.dataset.del).delete().catch(e => alert(e.message)); });
    if ($('#delc')) $('#delc').hidden = !ms.length;
    if (nearBottom || first) window.scrollTo(0, document.body.scrollHeight);
  };
  pageUnsub = db.collection('messages').where('uid', '==', uid).onSnapshot(sn => {
    ms = sn.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => a.createdAt - b.createdAt);
    if (isAdmin && !name) { const u = ms.find(m => m.from === 'user'); if (u && $('#tt')) { name = u.name; $('#tt').textContent = name; } }
    ms.filter(m => m.from === other && !m[flag]).forEach(m => db.collection('messages').doc(m.id).update({[flag]: true}).catch(() => {}));
    draw(); first = false;
  }, e => { if ($('#thr')) $('#thr').textContent = 'Erreur : ' + e.message; });
  const send = async () => {
    const ta = $('#msg'), text = ta.value.trim(); if (!text) return;
    ta.value = ''; ta.style.height = 'auto';
    try { await db.collection('messages').add({uid, name: name || (isAdmin ? 'Utilisateur' : nm(user)), from: mine, text, createdAt: Date.now(), readByAdmin: isAdmin, readByUser: !isAdmin}); }
    catch (e) { ta.value = text; alert(e.message); }
  };
  $('#send').onclick = send;
  notifAsk($('#thr'));
  if (!isAdmin) {
    $('#qk').innerHTML = ['Séance terminée 💪', 'J’ai une question sur un exercice', 'Je ne peux pas venir aujourd’hui'].map(t => `<button class="alt" data-q="${esc(t)}">${esc(t)}</button>`).join('');
    $('#qk').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const ta = $('#msg'); ta.value = b.dataset.q; ta.focus(); });
  }
  all().then(l => { $('#att').insertAdjacentHTML('beforeend', l.slice(0, 40).map(x => `<option value="${esc(x.id)}">${esc(x.title)} — ${esc(short(x.date))}</option>`).join('')); }).catch(() => {});
  $('#att').onchange = e => { if (!e.target.value) return; const ta = $('#msg'); ta.value = (ta.value ? ta.value + '\n' : '') + location.origin + location.pathname + '#/seance/' + e.target.value; e.target.value = ''; ta.focus(); };
  $('#msg').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; };
  $('#msg').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover:hover)').matches) { e.preventDefault(); send(); } };
  if ($('#delc')) $('#delc').onclick = async () => {
    if (!confirm('Supprimer toute la conversation ?')) return;
    const b = db.batch(); ms.forEach(m => b.delete(db.collection('messages').doc(m.id)));
    await b.commit(); location.hash = '#/messages';
  };
}

const addDays = (k, n) => { const d = new Date(k + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const LIM = {name: 80, sets: 10, reps: 20, load: 30, rest: 20, notes: 200, video: 300};
const parseLines = t => t.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 40).map(l => {
  const [name, sr, load, rest, notes] = l.split('|').map(x => x.trim()), m = /^(\d+)\s*[x×*]\s*(.+)$/i.exec(sr || '');
  return {...blank(), name: name || '', sets: m ? m[1] : '', reps: m ? m[2] : (sr || ''), load: load || '', rest: rest || '', notes: notes || ''};
});
async function editSession(id, preset) {
  let s = {title: '', date: /^\d{4}-\d{2}-\d{2}$/.test(preset || '') ? preset : today(), exercises: [blank()]};
  if (id) { const d = await db.collection('sessions').doc(id).get(); if (d.exists) s = d.data(); }
  s.rep = 1; s.bulk = '';
  const existing = await all(), known = new Set(DEFAULTS);
  existing.forEach(x => x.exercises.forEach(e => known.add(e.name)));
  const field = (i, k, ph, v) => `<input data-i="${i}" data-k="${k}" maxlength="${LIM[k]}" value="${esc(v)}" placeholder="${ph}" aria-label="${ph}">`;
  const draw = () => {
    app.innerHTML = `<h1>${id ? 'Modifier la séance' : 'Nouvelle séance'}</h1>
    <datalist id="exlist">${[...known].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <label for="t">Titre</label><input id="t" maxlength="100" value="${esc(s.title)}" placeholder="Pecs / triceps">
    <label for="d">Date</label><input id="d" type="date" value="${esc(s.date)}">
    ${id ? '' : `<div class="card"><b>Gagner du temps</b>
      <label for="tpl">Partir d’une séance existante</label><div class="row nowrap"><select id="tpl"><option value="">Choisir…</option>${existing.map(x => `<option value="${esc(x.id)}">${esc(x.title)} — ${esc(fmt(x.date))}</option>`).join('')}</select><button class="alt" id="tplgo" style="flex:none">Charger</button></div>
      <label for="rep">Répéter chaque semaine</label><select id="rep">${[1, 2, 3, 4, 6, 8, 12].map(n => `<option value="${n}" ${n === s.rep ? 'selected' : ''}>${n === 1 ? 'Une seule fois' : n + ' semaines (même jour)'}</option>`).join('')}</select>
      <label for="bulk">Coller une liste d’exercices</label><textarea id="bulk" rows="4" placeholder="Développé couché | 4x10 | 60 kg | 90 s | tempo 3-1-1">${esc(s.bulk)}</textarea>
      <p class="mute" style="margin:4px 0 8px;font-size:14px">Une ligne par exercice : nom | séries x reps | charge | repos | consigne</p><button class="alt" id="bulkgo">Ajouter ces exercices</button></div>`}
    <h2>Exercices (${s.exercises.length})</h2>${s.exercises.map((e, i) => `<div class="card">
      <input data-i="${i}" data-k="name" maxlength="${LIM.name}" list="exlist" value="${esc(e.name)}" placeholder="Nom de l'exercice" aria-label="Nom de l'exercice ${i + 1}">
      <div class="row" style="margin-top:8px">${field(i, 'sets', 'Séries', e.sets)}${field(i, 'reps', 'Reps', e.reps)}${field(i, 'load', 'Charge', e.load)}${field(i, 'rest', 'Repos', e.rest)}</div>
      <div style="margin-top:8px">${field(i, 'notes', 'Consigne (tempo, technique…)', e.notes)}</div>
      <div style="margin-top:8px"><input type="url" inputmode="url" autocapitalize="off" maxlength="${LIM.video}" data-i="${i}" data-k="video" value="${esc(e.video)}" placeholder="Lien vidéo YouTube ou Vimeo (optionnel)" aria-label="Lien vidéo"></div>
      <p class="row" style="margin:10px 0 0;flex:none"><button class="link" data-up="${i}" ${i ? '' : 'disabled'}>Monter</button><button class="link" data-down="${i}" ${i < s.exercises.length - 1 ? '' : 'disabled'}>Descendre</button><button class="link" data-cp="${i}">Dupliquer</button><button class="link" data-rm="${i}">Retirer</button></p></div>`).join('')}
    <p class="row stick"><button class="alt" id="add">+ Ajouter un exercice</button><button id="sv">Enregistrer la séance</button></p>`;
    const read = () => { s.title = $('#t').value; s.date = $('#d').value; if ($('#rep')) s.rep = +$('#rep').value; if ($('#bulk')) s.bulk = $('#bulk').value; app.querySelectorAll('[data-k]').forEach(i => s.exercises[i.dataset.i][i.dataset.k] = i.value); };
    const on = (sel, f) => app.querySelectorAll(sel).forEach(b => b.onclick = () => { read(); f(+Object.values(b.dataset)[0]); draw(); });
    const empty = () => s.exercises.length === 1 && !s.exercises[0].name.trim();
    $('#add').onclick = () => { read(); s.exercises.push(blank()); draw(); };
    if ($('#tplgo')) $('#tplgo').onclick = () => { read(); const t = existing.find(x => x.id === $('#tpl').value); if (!t) return; if (!s.title.trim()) s.title = t.title; s.exercises = clone(t.exercises); draw(); };
    if ($('#bulkgo')) $('#bulkgo').onclick = () => { read(); const n = parseLines(s.bulk).filter(e => e.name); if (!n.length) return; s.exercises = (empty() ? [] : s.exercises).concat(n).slice(0, 60); s.bulk = ''; draw(); };
    on('[data-rm]', i => s.exercises.splice(i, 1));
    on('[data-cp]', i => s.exercises.splice(i + 1, 0, {...s.exercises[i]}));
    on('[data-up]', i => { if (i) [s.exercises[i - 1], s.exercises[i]] = [s.exercises[i], s.exercises[i - 1]]; });
    on('[data-down]', i => { if (i < s.exercises.length - 1) [s.exercises[i + 1], s.exercises[i]] = [s.exercises[i], s.exercises[i + 1]]; });
    $('#sv').onclick = async () => {
      read();
      const ex = s.exercises.filter(e => e.name.trim()).map(e => { const o = {}; Object.keys(LIM).forEach(k => o[k] = String(e[k] || '').trim().slice(0, LIM[k])); return o; });
      const bad = ex.find(e => e.video && !okUrl(e.video)); if (bad) return alert('Lien vidéo invalide pour « ' + bad.name + ' » : https:// et YouTube ou Vimeo uniquement.');
      if (!s.title.trim() || !ex.length || !/^\d{4}-\d{2}-\d{2}$/.test(s.date)) return alert('Il faut un titre, une date et au moins un exercice.');
      $('#sv').disabled = true;
      const dates = id ? [s.date] : Array.from({length: s.rep || 1}, (_, k) => addDays(s.date, 7 * k));
      const b = db.batch(); let first;
      dates.forEach((d, k) => { const r = id ? db.collection('sessions').doc(id) : db.collection('sessions').doc(); if (!k) first = r.id; b.set(r, {title: s.title.trim().slice(0, 100), date: d, exercises: clone(ex)}); });
      try { await b.commit(); } catch (e) { $('#sv').disabled = false; return alert(e.message); }
      location.hash = dates.length > 1 ? '#/calendrier' : '#/seance/' + first;
    };
  };
  draw();
}
</script>
