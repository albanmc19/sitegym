<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4bff">
<title>Séances</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#14181f;--mute:#5d6673;--line:#d5d9e0;--acc:#1f4bff;--acc-ink:#fff;--ok:#12805c}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a202a;--ink:#eef1f6;--mute:#98a2b3;--line:#2c3441;--acc:#6f8cff;--acc-ink:#0a0f1c;--ok:#4fd1a1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--card);flex-wrap:wrap}
header b{font:800 26px 'Barlow Condensed',sans-serif;letter-spacing:.02em;margin-right:auto}
nav a,.link{color:var(--ink);text-decoration:none;font-weight:600;padding:4px 2px;border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;font-family:inherit;font-size:inherit}
nav a:hover,nav a.on{border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:24px 16px 80px}
h1{font:800 clamp(36px,8vw,56px)/1 'Barlow Condensed',sans-serif;margin:8px 0 6px}
h2{font:800 24px 'Barlow Condensed',sans-serif;margin:28px 0 8px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:12px 0}
.ex{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none;margin-top:2px}
.ex.done .nm{text-decoration:line-through;color:var(--mute)}
.nm{font-weight:600;font-size:18px}
button,.btn{font:600 16px Barlow,sans-serif;background:var(--acc);color:var(--acc-ink);border:0;border-radius:4px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.del{background:transparent;color:#c0322b;border:1px solid #c0322b;padding:6px 12px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px;width:100%}
label{display:block;font-weight:600;margin:12px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 90px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;color:inherit}
.tag{font-size:14px;font-weight:600;color:var(--ok)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#login{text-align:center;padding-top:15vh}
.ex .w{margin-top:6px;padding:6px 9px;font-size:15px}button:disabled{opacity:.35;cursor:default}.row.nowrap{flex-wrap:nowrap}

html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
nav{display:flex;gap:16px}
.btn{text-align:center}
.vid{display:inline-block;margin-top:6px;padding:8px 12px;border:1px solid var(--acc);border-radius:4px;color:var(--acc);font-weight:600;text-decoration:none}
.stick{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin:0}
nav a .ic{display:none}
.bd{background:#d92d20;color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px;margin-left:6px;line-height:1.5}
.bub{max-width:84%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{margin-left:auto;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.bub.ot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
@media(max-width:600px){
 body{font-size:17px}
 header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;gap:8px;border-bottom-width:1px}
 header b{font-size:22px}
 #who{font-size:14px;margin-left:auto}
 header #out{min-height:36px;padding:6px 12px;font-size:14px;border-radius:8px}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;border:0;padding:6px 2px;color:var(--mute);position:relative}
 nav a.on{color:var(--acc)}
 nav a .ic{display:block;width:26px;height:26px}
 nav a .bd{position:absolute;top:0;left:54%;margin:0}
 main{padding:18px 14px calc(100px + env(safe-area-inset-bottom))}
 h1{font-size:40px}
 .card{border-radius:14px;padding:14px 12px}
 button,.btn{min-height:50px;border-radius:12px;padding:12px 16px;font-size:17px}
 button.del{padding:12px 16px}
 .link{padding:12px 8px}
 input,textarea{padding:12px;border-radius:10px}
 .ex{gap:12px}
 .ex input[type=checkbox]{width:30px;height:30px}
 .row>*{flex:1 1 45%}
 #save{width:100%}
 .comp{bottom:calc(64px + env(safe-area-inset-bottom))}
 .vid{padding:11px 14px}
 .stick{bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 0}
}
.day{text-align:center;color:var(--mute);font-size:13px;margin:14px 0 4px}
.comp{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0;margin-top:12px}
.comp textarea{flex:1;resize:none;max-height:140px}
.x{background:none;border:0;color:inherit;opacity:.85;text-decoration:underline;padding:0;min-height:0;font:inherit;font-size:12px;border-radius:0;cursor:pointer}
@media(max-width:600px){.comp{bottom:calc(64px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header><b>SÉANCES</b><nav id="nav"></nav><span id="who" class="mute"></span><button class="alt" id="out" hidden>Quitter</button></header>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== À REMPLIR ======
const firebaseConfig = {
  apiKey: "AIzaSyB3oNx4T2I4oeak_tzdL6wAbmvyO5lQjS4",
  authDomain: "sitegym-78f1e.firebaseapp.com",
  projectId: "sitegym-78f1e",
  storageBucket: "sitegym-78f1e.firebasestorage.app",
  messagingSenderId: "548938318019",
  appId: "1:548938318019:web:207852c70cff248798a276",
  measurementId: "G-RNKHDBQ4XF"
};
const ADMIN_EMAIL = "albanmc573@gmail.com"; // ton compte Google = admin
// =======================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmt = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const blank = () => ({name: '', sets: '', reps: '', load: '', rest: '', notes: '', video: ''});
const okUrl = u => /^https?:\/\/\S+$/i.test(u || '');
const detail = e => [e.sets && e.reps ? `${e.sets} × ${e.reps}` : (e.sets && e.sets + ' séries') || (e.reps && e.reps + ' reps'), e.load, e.rest && 'repos ' + e.rest, e.notes].filter(Boolean).join(' · ');
const DEFAULTS = ['Développé couché prise contre pecs','Chest press (pecs)','Pec fly banc','Mollet extension','Genou extension','Développé couché','Développé incliné','Pompes','Dips','Tractions','Rowing barre','Tirage vertical','Développé militaire','Élévations latérales','Curl biceps','Extension triceps','Squat','Presse à cuisses','Fentes','Soulevé de terre roumain','Leg curl','Mollets debout','Gainage','Crunch'];
let user = null, isAdmin = false;

auth.onAuthStateChanged(u => {
  user = u; isAdmin = !!u && (u.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  $('#out').hidden = !u; watchMsgs();
  if (u) db.collection('users').doc(u.uid).set({name: u.displayName || u.email, email: u.email, seen: Date.now()}, {merge: true}).catch(() => {});
  $('#who').textContent = u ? (u.displayName || u.email).split(' ')[0] + (isAdmin ? ' (admin)' : '') : '';
  route();
});
$('#out').onclick = () => auth.signOut();
addEventListener('hashchange', route);

const ICO = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  pen: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]}</svg>`;
let unread = 0, unsub = null, pageUnsub = null;
function nav() {
  document.title = (unread ? `(${unread}) ` : '') + 'Séances';
  const h = location.hash || '#/';
  const l = [['#/', 'home', "Aujourd'hui"], ['#/seances', 'list', 'Séances'], ['#/messages', 'chat', 'Messages']];
  if (isAdmin) l.push(['#/admin', 'pen', 'Gérer']);
  $('#nav').innerHTML = user ? l.map(([a, i, t]) => `<a href="${a}" class="${(a === '#/' ? h === '#/' : h.startsWith(a)) ? 'on' : ''}">${icon(i)}<span>${t}</span>${a === '#/messages' && unread ? `<span class="bd">${unread}</span>` : ''}</a>`).join('') : '';
}
function watchMsgs() {
  if (unsub) unsub(); unsub = null; unread = 0;
  if (!user) return;
  const q = isAdmin ? db.collection('messages') : db.collection('messages').where('uid', '==', user.uid);
  unsub = q.onSnapshot(sn => {
    unread = sn.docs.filter(d => { const m = d.data(); return isAdmin ? m.from === 'user' && !m.readByAdmin : m.from === 'admin' && !m.readByUser; }).length;
    nav();
  }, () => {});
}

async function route() {
  if (pageUnsub) { pageUnsub(); pageUnsub = null; }
  nav();
  if (!user) {
    app.innerHTML = `<div id="login"><h1>Séance du jour</h1><p class="mute">Connecte-toi pour voir le programme.</p><button id="g">Se connecter avec Google</button></div>`;
    $('#g').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
    return;
  }
  const [, page, id] = (location.hash || '#/').split('/');
  try {
    if (page === 'seance') return await viewSession(id);
    if (page === 'messages') return await messagesPage(id);
    if (page === 'seances') return await listSessions();
    if (page === 'admin' && isAdmin) return id ? await editSession(id === 'new' ? null : id) : await adminList();
    return await home();
  } catch (e) { app.innerHTML = `<div class="card">Erreur : ${esc(e.message)}</div>`; }
}

async function all() {
  const s = await db.collection('sessions').orderBy('date', 'desc').get();
  return s.docs.map(d => ({id: d.id, ...d.data()}));
}

async function home() {
  const list = await all(), t = today();
  const s = list.find(x => x.date === t) || [...list].reverse().find(x => x.date > t) || list[0];
  if (!s) { app.innerHTML = `<h1>Rien de prévu</h1><p class="mute">Aucune séance pour le moment.</p>${isAdmin ? '<a class="btn" href="#/admin/new">Créer la première séance</a>' : ''}`; return; }
  return viewSession(s.id, s.date === t ? "Aujourd'hui" : s.date > t ? 'Prochaine séance' : 'Dernière séance');
}

async function listSessions() {
  const list = await all();
  app.innerHTML = `<h1>Séances</h1>` + (list.length ? list.map(s =>
    `<a class="card item" href="#/seance/${s.id}"><span><b>${esc(s.title)}</b><br><span class="mute">${fmt(s.date)} · ${s.exercises.length} exercices</span></span></a>`).join('')
    : `<p class="mute">Aucune séance.</p>`);
}

async function adminList() {
  const list = await all();
  app.innerHTML = `<h1>Gérer les séances</h1><p><a class="btn" href="#/admin/new">+ Nouvelle séance</a></p>` + (list.length ? list.map(s =>
    `<div class="card"><b>${esc(s.title)}</b><br><span class="mute">${fmt(s.date)} · ${s.exercises.length} exercices</span>
    <p class="row" style="margin:10px 0 0;flex-wrap:wrap"><a class="btn alt" href="#/seance/${s.id}">Voir le suivi</a><a class="btn alt" href="#/admin/${s.id}">Modifier</a><button class="alt" data-dup="${s.id}">Dupliquer</button><button class="del" data-del="${s.id}">Supprimer</button></p></div>`).join('')
    : `<p class="mute">Aucune séance créée.</p>`);
  const by = id => list.find(s => s.id === id);
  app.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => {
    const s = by(b.dataset.dup), ref = db.collection('sessions').doc();
    await ref.set({title: s.title + ' (copie)', date: today(), exercises: s.exercises});
    location.hash = '#/admin/' + ref.id;
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (confirm('Supprimer cette séance ?')) { await db.collection('sessions').doc(b.dataset.del).delete(); adminList(); }
  });
}

async function viewSession(id, label) {
  const doc = await db.collection('sessions').doc(id).get();
  if (!doc.exists) { app.innerHTML = '<h1>Séance introuvable</h1>'; return; }
  const s = doc.data();
  const logRef = db.collection('logs').doc(id + '_' + user.uid);
  const mine = Object.assign({done: {}, w: {}, note: ''}, (await logRef.get()).data());
  mine.w = mine.w || {};
  const render = () => {
    const n = s.exercises.filter((_, i) => mine.done[i]).length;
    app.innerHTML = `<p class="mute">${label || fmt(s.date)}</p><h1>${esc(s.title)}</h1>
    <p class="mute">${label ? fmt(s.date) + ' · ' : ''}${n}/${s.exercises.length} exercices faits</p>
    <div class="bar"><i style="width:${s.exercises.length ? n / s.exercises.length * 100 : 0}%"></i></div>
    <div class="card">${s.exercises.map((e, i) => `<div class="ex ${mine.done[i] ? 'done' : ''}"><input type="checkbox" id="c${i}" data-i="${i}" ${mine.done[i] ? 'checked' : ''}>
      <div style="flex:1"><label for="c${i}" class="nm" style="margin:0">${esc(e.name)}</label><div class="mute">${esc(detail(e))}</div>${okUrl(e.video) ? `<a class="vid" href="${esc(e.video)}" target="_blank" rel="noopener">▶ Voir la vidéo</a>` : ''}
      <input class="w" data-w="${i}" value="${esc(mine.w[i])}" placeholder="Charge réellement utilisée" aria-label="Charge utilisée pour ${esc(e.name)}"></div></div>`).join('')}</div>
    <label for="note">Mon ressenti</label><textarea id="note" rows="3">${esc(mine.note)}</textarea>
    <p><button id="save">Enregistrer</button> <span id="ok" class="tag"></span></p>
    ${isAdmin ? `<h2>Suivi</h2><div id="track" class="mute">Chargement…</div><p class="row" style="flex-wrap:wrap"><a class="btn alt" href="#/admin/${id}">Modifier la séance</a></p>` : ''}`;
    app.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => { mine.done[c.dataset.i] = c.checked; save(false); });
    app.querySelectorAll('[data-w]').forEach(i => i.oninput = () => { mine.w[i.dataset.w] = i.value; });
    $('#save').onclick = () => save(true);
    if (isAdmin) db.collection('logs').where('sessionId', '==', id).get().then(q => {
      $('#track').innerHTML = q.empty ? 'Personne n’a encore validé d’exercice.' : q.docs.map(d => {
        const l = d.data(), ok = s.exercises.map((e, i) => [e, i]).filter(([, i]) => l.done && l.done[i]);
        return `<div class="card"><b>${esc(l.name)}</b> : ${ok.length}/${s.exercises.length} faits<br>${ok.map(([e, i]) => '✓ ' + esc(e.name) + (l.w && l.w[i] ? ' — ' + esc(l.w[i]) : '')).join('<br>') || '<span class="mute">rien de coché</span>'}${l.note ? `<br><i>« ${esc(l.note)} »</i>` : ''}</div>`;
      }).join('');
    });
  };
  async function save(manual) {
    if ($('#note')) mine.note = $('#note').value;
    await logRef.set({uid: user.uid, name: user.displayName || user.email, sessionId: id, done: mine.done, w: mine.w, note: mine.note, updatedAt: Date.now()});
    if (manual) $('#ok').textContent = 'Enregistré'; else render();
  }
  render();
}

const when = t => new Date(t).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
const dayKey = t => new Date(t - new Date(t).getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const dayLabel = t => { const k = dayKey(t), n = Date.now(); return k === dayKey(n) ? "Aujourd'hui" : k === dayKey(n - 864e5) ? 'Hier' : fmt(k); };
const whenShort = t => dayKey(t) === dayKey(Date.now()) ? when(t) : new Date(t).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');

async function messagesPage(uid) {
  if (!isAdmin) return thread(user.uid, user.displayName || user.email);
  if (uid) return thread(uid);
  app.innerHTML = `<h1>Messages</h1><p><button id="newm" class="alt">+ Nouveau message</button></p><div id="usrs" hidden></div><div id="inbox"></div>`;
  const us = (await db.collection('users').get().catch(() => ({docs: []}))).docs.map(d => ({uid: d.id, ...d.data()})).filter(u => u.uid !== user.uid);
  $('#usrs').innerHTML = us.length ? us.map(u => `<a class="card item" href="#/messages/${esc(u.uid)}"><b>${esc(u.name)}</b><span class="mute">${esc(u.email)}</span></a>`).join('') : '<p class="mute">Personne ne s’est encore connecté.</p>';
  $('#newm').onclick = () => { $('#usrs').hidden = !$('#usrs').hidden; };
  let ms = [];
  const draw = () => {
    if (!$('#inbox')) return;
    const g = {};
    ms.forEach(m => {
      const c = g[m.uid] || (g[m.uid] = {uid: m.uid, name: m.name, last: m, unread: 0});
      if (m.createdAt >= c.last.createdAt) c.last = m;
      if (m.from === 'user') { c.name = m.name; if (!m.readByAdmin) c.unread++; }
    });
    const list = Object.values(g).sort((a, b) => b.last.createdAt - a.last.createdAt);
    $('#inbox').innerHTML = list.length ? list.map(c => `<a class="card item" href="#/messages/${esc(c.uid)}"><span><b>${esc(c.name)}</b>${c.unread ? `<span class="bd" style="position:static">${c.unread}</span>` : ''}<br><span class="mute">${esc((c.last.from === 'admin' ? 'Toi : ' : '') + c.last.text.slice(0, 80))}</span></span><span class="mute">${whenShort(c.last.createdAt)}</span></a>`).join('') : '<p class="mute">Aucun message pour l’instant.</p>';
  };
  pageUnsub = db.collection('messages').onSnapshot(sn => { ms = sn.docs.map(d => d.data()); draw(); }, e => { if ($('#inbox')) $('#inbox').textContent = 'Erreur : ' + e.message; });
}

async function thread(uid, nameHint) {
  const mine = isAdmin ? 'admin' : 'user', other = isAdmin ? 'user' : 'admin', flag = isAdmin ? 'readByAdmin' : 'readByUser';
  let name = nameHint;
  if (isAdmin && !name) { const d = await db.collection('users').doc(uid).get().catch(() => null); name = d && d.exists ? d.data().name : null; }
  app.innerHTML = `${isAdmin ? '<p><a class="link" href="#/messages">← Tous les messages</a></p>' : ''}<h1 id="tt">${isAdmin ? esc(name || 'Conversation') : 'Messages'}</h1>
  ${isAdmin ? '<p><button class="link" id="delc" hidden>Supprimer la conversation</button></p>' : '<p class="mute">Écris à Alban, sa réponse apparaîtra ici en direct.</p>'}
  <div id="thr"></div>
  <div class="comp"><textarea id="msg" rows="1" maxlength="1000" placeholder="Écrire un message…" aria-label="Message"></textarea><button id="send">Envoyer</button></div>`;
  let ms = [], first = true;
  const draw = () => {
    const box = $('#thr'); if (!box) return;
    const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 160;
    let last = '';
    box.innerHTML = ms.length ? ms.map(m => {
      const k = dayKey(m.createdAt), sep = k !== last ? `<div class="day">${dayLabel(m.createdAt)}</div>` : ''; last = k;
      const me = m.from === mine, seen = me && (isAdmin ? m.readByUser : m.readByAdmin);
      return `${sep}<div class="bub ${me ? 'me' : 'ot'}">${linkify(m.text)}<small>${when(m.createdAt)}${seen ? ' · Vu' : ''}${me || isAdmin ? ` · <button class="x" data-del="${m.id}">Supprimer</button>` : ''}</small></div>`;
    }).join('') : '<p class="mute">Aucun message pour l’instant.</p>';
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Supprimer ce message ?')) db.collection('messages').doc(b.dataset.del).delete().catch(e => alert(e.message)); });
    if ($('#delc')) $('#delc').hidden = !ms.length;
    if (nearBottom || first) window.scrollTo(0, document.body.scrollHeight);
  };
  pageUnsub = db.collection('messages').where('uid', '==', uid).onSnapshot(sn => {
    ms = sn.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => a.createdAt - b.createdAt);
    if (isAdmin && !name) { const u = ms.find(m => m.from === 'user'); if (u && $('#tt')) { name = u.name; $('#tt').textContent = name; } }
    ms.filter(m => m.from === other && !m[flag]).forEach(m => db.collection('messages').doc(m.id).update({[flag]: true}).catch(() => {}));
    draw(); first = false;
  }, e => { if ($('#thr')) $('#thr').textContent = 'Erreur : ' + e.message; });
  const send = async () => {
    const ta = $('#msg'), text = ta.value.trim(); if (!text) return;
    ta.value = ''; ta.style.height = 'auto';
    try { await db.collection('messages').add({uid, name: name || (isAdmin ? 'Utilisateur' : user.displayName || user.email), from: mine, text, createdAt: Date.now(), readByAdmin: isAdmin, readByUser: !isAdmin}); }
    catch (e) { ta.value = text; alert(e.message); }
  };
  $('#send').onclick = send;
  $('#msg').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; };
  $('#msg').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover:hover)').matches) { e.preventDefault(); send(); } };
  if ($('#delc')) $('#delc').onclick = async () => {
    if (!confirm('Supprimer toute la conversation ?')) return;
    const b = db.batch(); ms.forEach(m => b.delete(db.collection('messages').doc(m.id)));
    await b.commit(); location.hash = '#/messages';
  };
}

async function editSession(id) {
  let s = {title: '', date: today(), exercises: [blank()]};
  if (id) { const d = await db.collection('sessions').doc(id).get(); if (d.exists) s = d.data(); }
  const known = new Set(DEFAULTS);
  (await all()).forEach(x => x.exercises.forEach(e => known.add(e.name)));
  const field = (i, k, ph, v) => `<input data-i="${i}" data-k="${k}" value="${esc(v)}" placeholder="${ph}" aria-label="${ph}">`;
  const draw = () => {
    app.innerHTML = `<h1>${id ? 'Modifier la séance' : 'Nouvelle séance'}</h1>
    <datalist id="exlist">${[...known].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <label for="t">Titre</label><input id="t" value="${esc(s.title)}" placeholder="Pecs / triceps">
    <label for="d">Date</label><input id="d" type="date" value="${s.date}">
    <h2>Exercices (${s.exercises.length})</h2>${s.exercises.map((e, i) => `<div class="card">
      <input data-i="${i}" data-k="name" list="exlist" value="${esc(e.name)}" placeholder="Nom de l'exercice" aria-label="Nom de l'exercice ${i + 1}">
      <div class="row" style="margin-top:8px">${field(i, 'sets', 'Séries', e.sets)}${field(i, 'reps', 'Reps', e.reps)}${field(i, 'load', 'Charge', e.load)}${field(i, 'rest', 'Repos', e.rest)}</div>
      <div style="margin-top:8px">${field(i, 'notes', 'Consigne (tempo, technique…)', e.notes)}</div>
      <div style="margin-top:8px"><input type="url" inputmode="url" autocapitalize="off" data-i="${i}" data-k="video" value="${esc(e.video)}" placeholder="Lien vidéo YouTube (optionnel)" aria-label="Lien vidéo YouTube"></div>
      <p class="row" style="margin:10px 0 0;flex:none"><button class="link" data-up="${i}" ${i ? '' : 'disabled'}>Monter</button><button class="link" data-down="${i}" ${i < s.exercises.length - 1 ? '' : 'disabled'}>Descendre</button><button class="link" data-cp="${i}">Dupliquer</button><button class="link" data-rm="${i}">Retirer</button></p></div>`).join('')}
    <p class="row stick"><button class="alt" id="add">+ Ajouter un exercice</button><button id="sv">Enregistrer la séance</button></p>`;
    const read = () => { s.title = $('#t').value; s.date = $('#d').value; app.querySelectorAll('[data-k]').forEach(i => s.exercises[i.dataset.i][i.dataset.k] = i.value); };
    const on = (sel, f) => app.querySelectorAll(sel).forEach(b => b.onclick = () => { read(); f(+Object.values(b.dataset)[0]); draw(); });
    $('#add').onclick = () => { read(); s.exercises.push(blank()); draw(); };
    on('[data-rm]', i => s.exercises.splice(i, 1));
    on('[data-cp]', i => s.exercises.splice(i + 1, 0, {...s.exercises[i]}));
    on('[data-up]', i => { if (i) [s.exercises[i - 1], s.exercises[i]] = [s.exercises[i], s.exercises[i - 1]]; });
    on('[data-down]', i => { if (i < s.exercises.length - 1) [s.exercises[i + 1], s.exercises[i]] = [s.exercises[i], s.exercises[i + 1]]; });
    $('#sv').onclick = async () => {
      read(); const ex = s.exercises.filter(e => e.name.trim()).map(e => ({...e, name: e.name.trim(), video: (e.video || '').trim()}));
      const bad = ex.find(e => e.video && !okUrl(e.video)); if (bad) return alert('Lien vidéo invalide pour « ' + bad.name + ' » : il doit commencer par https://');
      if (!s.title.trim() || !ex.length || !s.date) return alert('Il faut un titre, une date et au moins un exercice.');
      const ref = id ? db.collection('sessions').doc(id) : db.collection('sessions').doc();
      await ref.set({title: s.title.trim(), date: s.date, exercises: ex});
      location.hash = '#/seance/' + ref.id;
    };
  };
  draw();
}
</script>
